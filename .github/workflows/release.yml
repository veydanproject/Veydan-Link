name: Release

# A tag vX.Y.Z publishes the bridge: static binaries for four systems with
# their SHA256SUMS in the release of the tag, and the image veydan/vlink.
# This is the one place volunteers take the bridge from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The version and the components rust-toolchain.toml names.
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu aarch64-apple-darwin
          rustc -V

      - uses: swatinem/rust-cache@v2
        with:
          key: release

      # The tag names the version the crates carry.
      - name: The tag is the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # dist/vlink, static, for Linux x86_64: what the image holds. The
      # script fetches zig and installs cargo-zigbuild.
      - name: Build the bridge (Linux, static)
        run: bash scripts/build-release.sh

      # dist/all/: Linux x86_64 and aarch64, Windows, macOS, SHA256SUMS.
      - name: Build the bridge for every system
        run: bash scripts/build-all.sh

      - name: Publish the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/all/vlink-* dist/all/SHA256SUMS LICENSE THIRD-PARTY-LICENSES.md \
            --title "VLink $VERSION" --notes-file CHANGELOG.md --verify-tag

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image veydan/vlink
        run: |
          docker build -t "veydan/vlink:$VERSION" -t veydan/vlink:latest -f deploy/Dockerfile .
          docker push "veydan/vlink:$VERSION"
          docker push veydan/vlink:latest
