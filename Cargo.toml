# VLink: the bridge that carries Veydan traffic past a throttled border,
# and what a client needs to use one.
#
#   vlink-proto    the wire protocol: who a bridge is, streams, signed lists
#   vlink-client   opens streams through a bridge (the Veydan app is built on it)
#   vlink          the bridge; anybody may run one
#
# The hub that bridges connect to is not here: it is run by the Veydan
# project alone. It uses vlink-proto from this folder.
#
# Self-contained on purpose: no path dependency leaves this folder, so the
# whole thing moves to its own repository by moving the folder.
[workspace]
resolver = "2"
members = ["crates/vlink-proto", "crates/vlink-client", "crates/vlink"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# The newest things used: const `str::split_at` (1.86), `is_multiple_of` (1.87)
rust-version = "1.87"
publish = false
authors = ["Veydan Project"]
# PolyForm Perimeter 1.0.1, as the whole project: LICENSE is a copy of the
# monorepo's, here because this folder becomes the root of a repository.
license-file = "LICENSE"

[workspace.dependencies]
vlink-proto = { path = "crates/vlink-proto" }
vlink-client = { path = "crates/vlink-client" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
h2 = "0.4"
http = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The X.509 parser rustls itself uses, named here for the key a certificate carries.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
